{% extends "layout/basic.html" %}

{% block content %}
<!-- Main Container -->
<div class="main-container">
    <!-- React App 挂载点 -->
    <div id="typing-hall-react-app"></div>

    <!-- 数据传递给 React（统一用 |json|safe 序列化，避免 XSS 与裸输出问题） -->
    <script id="typing-hall-data" type="application/json">
    {{ {
        "globalStats": globalStats,
        "userStats": userStats,
        "userMaxRank": userMaxRank,
        "userAvgRank": userAvgRank,
        "maxWpmRanking": maxWpmRanking,
        "avgWpmRanking": avgWpmRanking,
        "improvementRanking": improvementRanking,
        "recentRecords": recentRecords,
        "speedDistribution": speedDistribution,
        "userSpeedPoints": userSpeedPoints,
        "weeklyTrend": weeklyTrend,
        "udocs": udocs,
        "canManage": canManage,
        "isLoggedIn": isLoggedIn,
        "currentUserId": currentUserId,
        "seasonData": seasonData
    } | json | safe }}
    </script>
</div>


{% endblock %}
