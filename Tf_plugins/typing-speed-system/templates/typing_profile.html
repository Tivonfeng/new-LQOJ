{% extends "layout/basic.html" %}

{% block content %}
<!-- React App Container -->
<div id="typing-profile-react-app"></div>

<!-- 数据传递给 React（统一用 |json|safe 序列化，避免 XSS 与裸输出问题） -->
<script id="typing-profile-data" type="application/json">
{{ {
    "userStats": userStats,
    "maxRank": maxRank,
    "avgRank": avgRank,
    "userRecords": userRecords,
    "progressData": progressData,
    "recorderDocs": recorderDocs
} | json | safe }}
</script>

{% endblock %}
