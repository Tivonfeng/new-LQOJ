name: CommitLint

on:
  pull_request:
  push:
    branches: [tf_dev, master]

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
    - name: Check out
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install commitlint
      run: npm install --no-save --no-package-lock @commitlint/cli@^21 @commitlint/config-conventional@^21
    - name: Validate commit messages (PR)
      if: github.event_name == 'pull_request'
      run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
    - name: Validate HEAD commit (push)
      if: github.event_name == 'push'
      run: npx commitlint --last
